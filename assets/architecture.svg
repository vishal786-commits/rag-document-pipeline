<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 714" width="1180" height="714" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!--
    Base colours are inline attributes (light theme) so the file renders in any
    SVG viewer. The stylesheet supplies only the dark-theme override, which wins
    because CSS beats presentation attributes.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0b1220; }
      .band   { fill: #111c2e; stroke: #24334d; }
      .inner  { fill: #0e1829; stroke: #24334d; }
      .box    { fill: #16233a; stroke: #38496b; }
      .accent { fill: #0e2b23; stroke: #34d399; }
      .store  { fill: #10233f; stroke: #60a5fa; }
      .t      { fill: #e8edf7; }
      .sub    { fill: #94a3b8; }
      .hdr    { fill: #34d399; }
      .line   { stroke: #64748b; }
      .loop   { stroke: #34d399; }
      .arrow  { stroke: #64748b; }
      .arrowg { stroke: #34d399; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,1 L9,5 L0,9" fill="none" stroke="#94a3b8" stroke-width="1.7"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowg" d="M0,1 L9,5 L0,9" fill="none" stroke="#10b981" stroke-width="1.7"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="714" fill="#ffffff"/>

  <!-- ═══════════════════ INGESTION ═══════════════════ -->
  <rect class="band" x="24" y="24" width="1132" height="182" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="hdr" x="46" y="52" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.4">INGESTION</text>
  <text class="sub" x="132" y="52" fill="#64748b" font-size="11.5">python -m rag.ingest  ·  offline, re-run when the corpus changes</text>

  <rect class="box" x="46" y="70" width="148" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="120" y="99" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">knowledge_base/</text>
  <text class="sub" x="120" y="118" fill="#64748b" font-size="11.5" text-anchor="middle">36 policy PDFs</text>

  <rect class="box" x="238" y="70" width="172" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="324" y="95" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">loader</text>
  <text class="sub" x="324" y="114" fill="#64748b" font-size="11.5" text-anchor="middle">pymupdf4llm</text>
  <text class="sub" x="324" y="130" fill="#64748b" font-size="11.5" text-anchor="middle">Markdown per page</text>

  <rect class="accent" x="454" y="70" width="232" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text class="t" x="570" y="93" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">chunker</text>
  <text class="sub" x="570" y="112" fill="#64748b" font-size="11.5" text-anchor="middle">split on headings · tables kept whole</text>
  <text class="sub" x="570" y="128" fill="#64748b" font-size="11.5" text-anchor="middle">heading path prepended to each chunk</text>

  <rect class="box" x="730" y="70" width="150" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="805" y="95" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">embed</text>
  <text class="sub" x="805" y="114" fill="#64748b" font-size="11.5" text-anchor="middle">text-embedding-</text>
  <text class="sub" x="805" y="130" fill="#64748b" font-size="11.5" text-anchor="middle">3-small · 1536d</text>

  <rect class="store" x="928" y="62" width="204" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="t" x="1030" y="80" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Pinecone</text>
  <text class="sub" x="1030" y="95" fill="#64748b" font-size="10.5" text-anchor="middle">687 vectors · ns knowledgebase</text>

  <rect class="store" x="928" y="114" width="204" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="t" x="1030" y="132" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">kb_chunks.jsonl</text>
  <text class="sub" x="1030" y="147" fill="#64748b" font-size="10.5" text-anchor="middle">committed · BM25 + eval corpus</text>

  <line class="line" x1="194" y1="106" x2="232" y2="106" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <line class="line" x1="410" y1="106" x2="448" y2="106" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <line class="line" x1="686" y1="106" x2="724" y2="106" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="line" d="M880,98 H904 V83 H922" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="line" d="M880,114 H904 V135 H922" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <text class="sub" x="46" y="180" fill="#64748b" font-size="11">Ingest aborts unless docs/CORPUS_SUMMARY.md and knowledge_base/ reconcile exactly — a partial corpus is never indexed.</text>

  <!-- ═══════════════════ QUERY ═══════════════════ -->
  <rect class="band" x="24" y="228" width="1132" height="462" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="hdr" x="46" y="256" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.4">QUERY</text>
  <text class="sub" x="106" y="256" fill="#64748b" font-size="11.5">POST /ask  ·  stateless — conversation history is supplied by the client</text>

  <rect class="box" x="46" y="424" width="98" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="95" y="448" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">Streamlit</text>
  <text class="sub" x="95" y="465" fill="#64748b" font-size="11.5" text-anchor="middle">chat UI</text>

  <rect class="box" x="170" y="424" width="98" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="219" y="448" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">FastAPI</text>
  <text class="sub" x="219" y="465" fill="#64748b" font-size="11.5" text-anchor="middle">/ask</text>

  <line class="line" x1="144" y1="451" x2="164" y2="451" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <line class="line" x1="268" y1="451" x2="300" y2="451" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="inner" x="300" y="276" width="840" height="398" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.2"/>
  <text class="hdr" x="318" y="300" fill="#10b981" font-size="12" font-weight="700" letter-spacing="1.4">LANGGRAPH</text>
  <text class="sub" x="404" y="300" fill="#64748b" font-size="11">the route decides how much work the question is worth</text>

  <rect class="accent" x="320" y="424" width="92" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text class="t" x="366" y="448" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">route</text>
  <text class="sub" x="366" y="465" fill="#64748b" font-size="11" text-anchor="middle">one call</text>

  <!-- Each branch box carries its own trigger, so no labels float over the wires. -->
  <rect class="box" x="500" y="316" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="598" y="336" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">canned reply</text>
  <text class="sub" x="598" y="352" fill="#64748b" font-size="10.5" text-anchor="middle">greeting · out of scope</text>
  <path class="line" d="M412,438 H456 V339 H494" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="500" y="372" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="598" y="392" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">ask the user back</text>
  <text class="sub" x="598" y="408" fill="#64748b" font-size="10.5" text-anchor="middle">too vague to search</text>
  <path class="line" d="M412,444 H470 V395 H494" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="500" y="428" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="598" y="448" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">agent + tools</text>
  <text class="sub" x="598" y="464" fill="#64748b" font-size="10.5" text-anchor="middle">about the corpus itself</text>
  <line class="line" x1="412" y1="451" x2="494" y2="451" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="744" y="424" width="228" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="858" y="444" fill="#0f172a" font-size="11.5" text-anchor="middle">list_policies · policy_sections</text>
  <text class="t" x="858" y="459" fill="#0f172a" font-size="11.5" text-anchor="middle">search_policies</text>
  <text class="sub" x="858" y="472" fill="#64748b" font-size="10" text-anchor="middle">metadata lookups · max 3 calls</text>
  <line class="line" x1="696" y1="451" x2="738" y2="451" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="500" y="484" width="196" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="598" y="504" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">decompose</text>
  <text class="sub" x="598" y="520" fill="#64748b" font-size="10.5" text-anchor="middle">spans several policies</text>
  <path class="line" d="M412,458 H470 V507 H494" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="accent" x="500" y="546" width="196" height="82" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text class="t" x="598" y="567" fill="#0f172a" font-size="13.5" font-weight="600" text-anchor="middle">retrieve</text>
  <text class="sub" x="598" y="585" fill="#64748b" font-size="11" text-anchor="middle">Pinecone dense · 20</text>
  <text class="sub" x="598" y="600" fill="#64748b" font-size="11" text-anchor="middle">BM25 sparse · 20</text>
  <text class="sub" x="598" y="617" fill="#64748b" font-size="11" text-anchor="middle">fused by RRF → 6</text>
  <path class="line" d="M412,464 H442 V587 H494" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
  <path class="line" d="M598,530 V540" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="744" y="568" width="156" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text class="t" x="822" y="593" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">grade context</text>
  <line class="line" x1="696" y1="588" x2="738" y2="588" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="accent" x="962" y="568" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text class="t" x="1037" y="593" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">generate</text>
  <line class="line" x1="900" y1="588" x2="956" y2="588" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>

  <path class="loop" stroke-dasharray="5 4" d="M822,608 V644 H598 V634" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#ag)"/>
  <text class="hdr" x="710" y="664" fill="#10b981" font-size="10.5" text-anchor="middle">context insufficient → rewrite the query and retrieve once more</text>

  <rect class="store" x="962" y="492" width="150" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="t" x="1037" y="513" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">cited answer</text>
  <text class="sub" x="1037" y="528" fill="#64748b" font-size="10.5" text-anchor="middle">[Fire Safety.pdf p.4]</text>
  <text class="sub" x="1037" y="541" fill="#64748b" font-size="10.5" text-anchor="middle">+ expiry warning</text>
  <path class="line" d="M1037,568 V554" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
